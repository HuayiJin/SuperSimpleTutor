<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Infra 极简实战台 | SuperSimpleTutor</title>
  <meta name="description" content="AI Infra 极简实战台（SuperSimpleTutor）：LeetGPU 前 10 题 Triton/CUDA 双轨速通 + LLM 分布式训练显存与 4D 并行推演台。" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="modules/llm-sim.css" />
</head>
<body>
  <div class="app-shell" id="app-shell" data-track="triton" data-module="leetgpu">
    <!-- 顶部全局导航栏 -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <button id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="切换题目目录" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="brand" id="brand-home" role="button" tabindex="0">
          <span class="brand-logo" id="brand-logo" aria-hidden="true">⚡</span>
          <div class="brand-text">
            <span class="brand-title">SuperSimple<span class="accent-emerald">Tutor</span></span>
            <span class="brand-sub" id="brand-sub">AI Infra 极简实战台</span>
          </div>
        </div>

        <!-- 一级应用模块切换器 -->
        <div class="module-switcher" role="tablist" aria-label="平台工具模块">
          <button class="module-btn active" data-module-btn="leetgpu" role="tab" aria-selected="true">
            <span aria-hidden="true">⚡</span>LeetGPU 前10题
          </button>
          <button class="module-btn" data-module-btn="llm" role="tab" aria-selected="false">
            <span aria-hidden="true">🧠</span>LLM 4D 显存推演
          </button>
        </div>
      </div>

      <!-- LeetGPU 专属子视图导航 -->
      <nav class="topbar-tabs leetgpu-only" role="tablist" aria-label="LeetGPU 子功能区">
        <button class="nav-tab active" data-view="roadmap" role="tab" aria-selected="true">
          <span class="tab-dot"></span>一天路线图
        </button>
        <button class="nav-tab" data-view="studio" role="tab" aria-selected="false">
          <span class="tab-dot"></span>10 题实验室
        </button>
        <button class="nav-tab" data-view="cheatsheet" role="tab" aria-selected="false">
          <span class="tab-dot"></span>双轨速查表
        </button>
      </nav>

      <div class="topbar-right">
        <!-- LeetGPU 专属右侧状态：双轨切换 + 进度/积分 -->
        <div class="topbar-group leetgpu-only">
          <div class="track-switcher" role="group" aria-label="学习主轨切换" title="快捷键 T 随时切换 Triton / CUDA 主轨">
            <button class="track-btn active" data-track-btn="triton">
              <span class="track-dot track-dot-triton"></span>Triton
            </button>
            <button class="track-btn" data-track-btn="cuda">
              <span class="track-dot track-dot-cuda"></span>CUDA
            </button>
          </div>

          <div class="progress-cluster" aria-live="polite">
            <div class="stat-pill" title="当前主轨已完成题数">
              <span class="stat-label" id="stat-track-label">Triton</span>
              <strong id="solved-count">0/10</strong>
            </div>
            <div class="stat-pill stat-pill-pts" title="当前主轨预估积分">
              <span class="stat-label">积分</span>
              <strong id="points-count">0 / 120</strong>
            </div>
          </div>
        </div>

        <!-- LLM 推演台专属右侧实时指标 -->
        <div class="topbar-group llm-only" aria-live="polite">
          <div class="stat-pill" title="模型总参数量 P">
            <span class="stat-label">参数</span>
            <strong id="llm-hdr-params">--</strong>
          </div>
          <div class="stat-pill" title="重计算算力代价">
            <span class="stat-label">重算</span>
            <strong id="llm-hdr-compute" class="accent-amber">+0.0%</strong>
          </div>
          <div class="stat-pill stat-pill-vram" id="llm-hdr-vram-pill" title="单卡峰值显存 / 上限">
            <span class="stat-label">显存</span>
            <strong id="llm-hdr-vram">--</strong>
          </div>
        </div>

        <!-- 全站共享浅色/深色主题切换 -->
        <button id="theme-toggle-btn" class="icon-btn theme-btn" aria-label="切换浅色/深色主题" title="切换深色/浅色主题">🌙</button>
      </div>
    </header>

    <!-- 模块 1：LeetGPU 一天速通工作区 -->
    <div class="workspace" id="workspace-leetgpu">
      <aside class="sidebar" id="sidebar" aria-label="10 题学习目录">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <h2 id="sidebar-track-heading">Triton 10 题路线</h2>
            <button id="sort-toggle-btn" class="mini-btn" title="在「一天冲刺顺序」与「LeetGPU 官方 #1-#10 顺序」间切换">
              冲刺顺序 ⇅
            </button>
          </div>
          <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="sidebar-progressbar">
            <div class="progress-bar-fill" id="sidebar-progress-fill" style="width: 0%"></div>
          </div>
          <div class="sidebar-meta">
            <span id="time-remaining">剩余预计约 3h 15m</span>
            <button id="reset-progress-btn" class="text-btn" title="重置当前主轨进度">重置本轨</button>
          </div>
          <div class="dual-progress-mini" id="dual-progress-mini">
            <span>⚡ Triton: <strong>0/10</strong></span>
            <span>🟢 CUDA: <strong>0/10</strong></span>
          </div>
        </div>

        <div class="problem-list" id="problem-list" role="list">
          <!-- app.js 动态渲染 -->
        </div>

        <div class="sidebar-footer">
          <div class="timer-widget">
            <div class="timer-top">
              <span class="timer-label">冲刺番茄钟</span>
              <span class="timer-display" id="timer-display">25:00</span>
            </div>
            <div class="timer-controls">
              <button class="mini-btn primary-mini" id="timer-toggle">开始</button>
              <button class="mini-btn" id="timer-reset">重置</button>
              <button class="mini-btn" id="timer-mode" title="切换 15 / 25 / 45 分钟">25m</button>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-content" id="main-content" tabindex="-1">
        <section id="view-roadmap" class="view-section active" aria-labelledby="roadmap-heading"></section>
        <section id="view-studio" class="view-section" aria-labelledby="studio-heading"></section>
        <section id="view-cheatsheet" class="view-section" aria-labelledby="cheatsheet-heading"></section>
      </main>
    </div>

    <!-- 模块 2：LLM 分布式训练显存与 4D 并行推演台（100% 全宽） -->
    <div class="llm-workspace" id="workspace-llm" hidden>
      <!-- modules/llm-sim.js 挂载区 -->
    </div>
  </div>

  <!-- 轻提示 Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
